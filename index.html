/* タッチの端末ではキーの番号を出さない */
@media (hover: none), (max-width: 899px) { :root[data-design="gauge"] .nav-btn[data-view]::after { display: none; } }

/* 配線：端末の空いている口が背景に沈まないよう、口の縁を見せる */
:root[data-design="gauge"] .wp .wp-sock { stroke: #3A4856; stroke-width: 1; }

/* ==========================================================================
   デザイナーズ — 紙の白に黒と朱。角のない罫線、重い文字、ずらした影、大きな番号
   いつも明るい配色（data-theme="light" と組み合わせて使う）
   ========================================================================== */
:root[data-design="studio"] {
  --font: "Helvetica Neue", Helvetica, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Noto Sans JP", system-ui, sans-serif;
  --canvas: #F2F2EE; --canvas-dot: #C4C4BD;
  --chrome: #F2F2EE; --surface: #F7F7F3; --surface-2: #EBEBE6; --surface-3: #E1E1DB;
  --glass: rgba(242, 242, 238, 0.97);
  --line: #CFCFC8; --line-strong: #111111;
  --ink: #111111; --ink-2: #2B2B29; --muted: #5A5A56; --faint: #85857F;
  --primary-bg: #111111; --primary-fg: #F2F2EE;
  --sig: #FF4A1C; --sig-ink: #C73A12;
  --sel: #FF4A1C; --sel-ink: #111111; --sel-soft: #FFE0D6;
  --poe: #FF4A1C; --tape: #111111; --tape-ink: #F2F2EE;
  --danger: #C42E14; --danger-soft: #FBE1DA; --ok: #1E7A4E;
  --m-lan: #111111; --m-wifi: #8C8C86; --m-fiber: #FF4A1C; --m-other: #55554F;
  --node-bg: #F7F7F3; --node-border: #111111; --node-ink: #111111; --node-sub: #4A4A46;
  --infra-bg: #111111; --infra-ink: #F2F2EE; --infra-sub: #C9C9C2; --infra-ico: rgba(255, 74, 28, 0.16); --infra-glyph: #FF4A1C;
  --g-client: #E1E1DB; --g-client-ink: #111111; --g-home: #E1E1DB; --g-home-ink: #111111;
  --g-office: #E1E1DB; --g-office-ink: #111111; --g-other: #E1E1DB; --g-other-ink: #111111;
  --room-bg: #F7F7F3; --room-border: #111111; --floor-label: #111111; --slab: #111111;
  --shadow-1: none;
  --shadow-2: 6px 6px 0 #111111;
  --shadow-3: 10px 10px 0 #111111;
  --scrim: rgba(17, 17, 17, 0.32);
}

/* ---------- 角はすべて直角（見本と、丸い印だけは別） ---------- */
:root[data-design="studio"] :where(*:not(.dz-prev, .dz-prev *)), :root[data-design="studio"] :where(*:not(.dz-prev, .dz-prev *))::before, :root[data-design="studio"] :where(*:not(.dz-prev, .dz-prev *))::after { border-radius: 0 !important; }
:root[data-design="studio"] :is(.tgl i, .layer-name .radio) { border-radius: 50% !important; }
:root[data-design="studio"] .tgl { border-radius: 0 !important; }

/* ---------- 文字：重く、大きく ---------- */
:root[data-design="studio"] body { font-feature-settings: "palt" 1; }
:root[data-design="studio"] .page-title { font-size: 34px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.15; }
:root[data-design="studio"] .page-head { padding-bottom: 12px; border-bottom: 3px solid #111111; }
:root[data-design="studio"] .set-title { font-size: 15px; font-weight: 900; color: #111111; letter-spacing: 0.02em; }
:root[data-design="studio"] .dgroup-h { font-weight: 900; font-size: 15px; }
:root[data-design="studio"] .dgroup-h .floor-badge { background: #111111; color: #F2F2EE; }
:root[data-design="studio"] .field-label { color: #111111; font-weight: 900; }
:root[data-design="studio"] .sheet-title { font-weight: 900; font-size: 17px; }
:root[data-design="studio"] .dname, :root[data-design="studio"] .set-row .label b { font-weight: 800; }
:root[data-design="studio"] .set-stat b { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; }
:root[data-design="studio"] .floor-num { color: #111111; font-weight: 900; }

/* ---------- 枠まわり：朱色の柱に番号つきのタブ ---------- */
:root[data-design="studio"] .nav { background: var(--sig); border-right: 3px solid #111111; counter-reset: snav; }
:root[data-design="studio"] .brand { background: #111111; color: var(--sig); }
:root[data-design="studio"] .nav-btn { color: #111111; font-weight: 800; position: relative; }
:root[data-design="studio"] .nav-btn[data-view]:not([data-view="settings"]) { counter-increment: snav; }
:root[data-design="studio"] .nav-btn[data-view]:not([data-view="settings"])::before { content: counter(snav, decimal-leading-zero); font: 800 10px/1 "Helvetica Neue", Helvetica, sans-serif; letter-spacing: 0.06em; margin-bottom: -2px; }
:root[data-design="studio"] .nav-ico { width: 54px; }
:root[data-design="studio"] .nav-btn:hover .nav-ico { background: rgba(17, 17, 17, 0.12); }
:root[data-design="studio"] .nav-btn.on .nav-ico { background: #111111; color: var(--sig); }
@media (max-width: 899px) {
  :root[data-design="studio"] .nav { background: #F2F2EE; border-right: 0; border-top: 3px solid #111111; }
  :root[data-design="studio"] .nav-btn.on .nav-ico { background: var(--sig); color: #111111; }
}
:root[data-design="studio"] .top { border-bottom: 3px solid #111111; }
:root[data-design="studio"] .net-title { font-size: 19px; font-weight: 900; letter-spacing: -0.01em; }
/* 保存の印はハンコ */
:root[data-design="studio"] .save-state { height: 30px; padding: 0 11px; border: 2.5px solid #D9361A; border-radius: 50% !important; color: #C42E14; font-weight: 900; font-size: 11.5px; transform: rotate(-8deg); letter-spacing: 0.04em; }
:root[data-design="studio"] .save-state .dot { display: none; }
:root[data-design="studio"] .save-state.saving { border-color: #85857F; color: #5A5A56; }
:root[data-design="studio"] .save-state.error { background: #FBE1DA; }

/* ---------- 部品：罫線とずらした影 ---------- */
:root[data-design="studio"] .btn { border: 2px solid #111111; background: transparent; font-weight: 800; }
:root[data-design="studio"] .btn:hover { background: #111111; color: #F2F2EE; }
:root[data-design="studio"] .btn-primary { background: #111111; color: #F2F2EE; }
:root[data-design="studio"] .btn-primary:hover { background: var(--sig); color: #111111; opacity: 1; }
:root[data-design="studio"] .top-add { background: var(--sig); color: #111111; border-color: #111111; box-shadow: 4px 4px 0 #111111; }
:root[data-design="studio"] .top-add:hover { background: var(--sig); color: #111111; transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #111111; }
:root[data-design="studio"] .btn-ghost { border-color: transparent; }
:root[data-design="studio"] .btn-ghost:hover { background: var(--surface-2); color: #111111; }
:root[data-design="studio"] .btn-danger { border-color: #C42E14; color: #C42E14; }
:root[data-design="studio"] .btn-danger:hover { background: #C42E14; color: #F2F2EE; }
:root[data-design="studio"] .icon-btn:hover:not(:disabled) { background: #111111; color: #F2F2EE; }
:root[data-design="studio"] .seg { background: transparent; box-shadow: inset 0 0 0 2px #111111; padding: 2px; gap: 0; }
:root[data-design="studio"] .seg button { color: #111111; font-weight: 800; }
:root[data-design="studio"] .seg button.on { background: #111111; color: #F2F2EE; box-shadow: none; }
:root[data-design="studio"] .chip { border: 2px solid #111111; color: #111111; font-weight: 800; background: transparent; }
:root[data-design="studio"] .chip.on { background: #111111; color: #F2F2EE; }
:root[data-design="studio"] .input, :root[data-design="studio"] .textarea, :root[data-design="studio"] .select { border: 2px solid #111111; background: #FAFAF7; }
:root[data-design="studio"] .input:focus, :root[data-design="studio"] .textarea:focus, :root[data-design="studio"] .select:focus { border-color: #111111; box-shadow: 4px 4px 0 var(--sig); }
:root[data-design="studio"] .name-input { background: #FAFAF7; border-color: #111111; }
:root[data-design="studio"] .glass { background: #F2F2EE; -webkit-backdrop-filter: none; backdrop-filter: none; border: 2px solid #111111; box-shadow: 4px 4px 0 #111111; }
:root[data-design="studio"] .map-mode.seg { background: #F2F2EE; border: 0; box-shadow: inset 0 0 0 2px #111111, 4px 4px 0 #111111; }
:root[data-design="studio"] .map-tools .btn-sm { border: 0; font-weight: 800; }
:root[data-design="studio"] .dlist, :root[data-design="studio"] .set-group, :root[data-design="studio"] .links-list, :root[data-design="studio"] .menu-list, :root[data-design="studio"] .tgl-list, :root[data-design="studio"] .bulk-preview, :root[data-design="studio"] .layer-list { border: 2px solid #111111; background: #F7F7F3; }
:root[data-design="studio"] .drow:hover, :root[data-design="studio"] .link-row:hover, :root[data-design="studio"] .menu-item:hover, :root[data-design="studio"] .tgl-row:hover { background: #FFE0D6; }
:root[data-design="studio"] .room-card, :root[data-design="studio"] .set-stat, :root[data-design="studio"] .empty, :root[data-design="studio"] .onboard-card, :root[data-design="studio"] .starter, :root[data-design="studio"] .room-quick, :root[data-design="studio"] .uplink-row, :root[data-design="studio"] .design-card { border: 2px solid #111111; background: #F7F7F3; }
:root[data-design="studio"] .room-card:hover, :root[data-design="studio"] .set-stat:hover, :root[data-design="studio"] .starter:hover, :root[data-design="studio"] .design-card:hover { box-shadow: 5px 5px 0 #111111; transform: translate(-2px, -2px); }
:root[data-design="studio"] .design-card.on { box-shadow: 5px 5px 0 var(--sig); }
:root[data-design="studio"] .design-card.on b::after { background: var(--sig); color: #111111; }
:root[data-design="studio"] .room-card .tape-label { box-shadow: none; }
:root[data-design="studio"] .dico { border-radius: 0; }
:root[data-design="studio"] .dico.infra { background: #111111; color: var(--sig); }
:root[data-design="studio"] .tag { background: transparent; box-shadow: inset 0 0 0 1.5px #111111; color: #111111; font-weight: 800; }
:root[data-design="studio"] .tag.tape { background: #111111; color: #F2F2EE; box-shadow: none; }
:root[data-design="studio"] .tgl { background: transparent; box-shadow: inset 0 0 0 2px #111111; }
:root[data-design="studio"] .tgl i { background: #111111; box-shadow: none; }
:root[data-design="studio"] .tgl.on { background: var(--sig); }
:root[data-design="studio"] .type-chip.on { background: var(--sig); border: 2px solid #111111; color: #111111; }
:root[data-design="studio"] .sheet { border: 2px solid #111111; }
:root[data-design="studio"] .sheet-head { border-bottom: 2px solid #111111; }
:root[data-design="studio"] .sheet-foot { border-top: 2px solid #111111; }
:root[data-design="studio"] .ctx-menu { border: 2px solid #111111; }
:root[data-design="studio"] .ctx-item:hover, :root[data-design="studio"] .ctx-item:focus-visible, :root[data-design="studio"] .ctx-item.open { background: #111111; color: #F2F2EE; }

:root[data-design="studio"] .ctx-head { color: #111111; font-weight: 900; }
:root[data-design="studio"] .toast { background: #111111; color: #F2F2EE; box-shadow: 6px 6px 0 var(--sig); }
:root[data-design="studio"] .toast button { background: var(--sig); color: #111111; }
:root[data-design="studio"] .actionbar { background: #111111; box-shadow: 6px 6px 0 var(--sig); }
:root[data-design="studio"] .actionbar button.accent .ic { color: var(--sig); }
:root[data-design="studio"] .hint-pill { border: 2px solid #111111; box-shadow: 4px 4px 0 #111111; }
:root[data-design="studio"] .fab { border: 3px solid #111111; box-shadow: 5px 5px 0 #111111; }

:root[data-design="studio"] .set-toc { border-bottom: 2px solid #111111; }

:root[data-design="studio"] .marquee { fill: rgba(255, 74, 28, 0.1); stroke: #111111; }

:root[data-design="studio"] .backup-warn .ic, :root[data-design="studio"] .auto-hint .ic { color: var(--sig-ink); }

/* ---------- 図：黒い札、朱の選択、大きな袋文字の番号と縦書きの見出し ---------- */

:root[data-design="studio"] .map[data-mode="rooms"]::after { content: "間取り"; }
:root[data-design="studio"] .map.wire-mode::after { content: "配線"; }

:root[data-design="studio"] .map.wire-mode[data-wbg="board"]::before, :root[data-design="studio"] .map.wire-mode[data-wbg="wood"]::before { display: none; }
@media (max-width: 899px) { :root[data-design="studio"] .map::before { font-size: 180px; } :root[data-design="studio"] .map::after { display: none; } }
:root[data-design="studio"] .n-body { filter: none; stroke-width: 2; }

:root[data-design="studio"] .e-port rect, :root[data-design="studio"] .e-label rect { fill: #F2F2EE; stroke: #111111 !important; stroke-width: 1.5; }
:root[data-design="studio"] .e-port text, :root[data-design="studio"] .e-label text { fill: #111111; font-weight: 800; }
:root[data-design="studio"] .e-end { fill: #F2F2EE; stroke: #111111 !important; }
:root[data-design="studio"] .room-box { stroke-width: 2; }
:root[data-design="studio"] .room-tape-text { font-weight: 800; }
:root[data-design="studio"] .band-label { font-weight: 900; }

:root[data-design="studio"] .map::before, :root[data-design="studio"] .map::after { z-index: 0; }
:root[data-design="studio"] .map svg.stage { z-index: 1; }
:root[data-design="studio"] .seg button.on .swatch { background: #F2F2EE !important; }

/* IP台帳：固定（黒）と自動（白地に黒枠）を見分ける。自動割り当て範囲は薄い朱の縞 */
:root[data-design="studio"] .ipg.k-au { background: #FFFFFF; color: #111111; box-shadow: inset 0 0 0 2px #111111; }
:root[data-design="studio"] .ipg.k-dh { background: repeating-linear-gradient(135deg, #E1E1DB 0 3px, #FFC7B5 3px 6px); }
/* スマホ：保存済みの判子を小さくして、ネットワーク名を切らない */
@media (max-width: 640px) {
  :root[data-design="studio"] .save-state { height: 24px; padding: 0 7px; font-size: 10px; border-width: 2px; }
  :root[data-design="studio"] .net-title { font-size: 17px; }
}

/* ---------- ガイド線（ドラッグ中に、ほかの機器の端や中心にそろえる） ---------- */

    const b = annotBox(a);
    xs.push({ v: b.x, b }, { v: b.x + b.w, b }); ys.push({ v: b.y, b }, { v: b.y + b.h, b });
  }
  const mine = { x: [box.x, box.x + box.w / 2, box.x + box.w], y: [box.y, box.y + box.h / 2, box.y + box.h] };
  let bx = null, by = null;

  for (const m of mine.y) for (const c of ys) { const d = c.v - m; if (Math.abs(d) <= thr && (!by || Math.abs(d) < Math.abs(by.d))) by = { d, v: c.v, b: c.b }; }

}

function saveTableCell(id, col, raw) {
  const d = devById(id); if (!d) return;

  let v = typeof raw === 'string' ? raw.trim() : raw;
  if (col === 'ip' && v) {

      case 'ports': { const n = parseInt(String(v).normalize('NFKC'), 10); d.ports = Number.isFinite(n) && n > 0 ? Math.min(n, 64) : null; break; }

function floorSortAsc(a, b) {
  const la = floorLevel(a), lb = floorLevel(b);
  const w = l => (typeof l === 'number' ? 0 : l === null ? 1 : 2);
  return w(la) - w(lb) || (typeof la === 'number' && typeof lb === 'number' ? la - lb : collator.compare(a, b));

/** 部屋の画面：機器のアイコン・未設定の機器を部屋のカードへドラッグ（PC） */
function bindRoomDrag() {
  const page = $('#roomsPage'); if (!page || page.dataset.dnd) return; page.dataset.dnd = '1';
  let drag = null, over = null;
  const clear = () => { over?.classList.remove('drop-on'); over = null; };
  page.addEventListener('dragstart', e => {
    const el = e.target.closest?.('[data-drag-dev]'); if (!el) return;
    const d = devById(el.dataset.dragDev); if (!d) return;
    drag = { id: d.id, from: d.roomId || '__unset' };
    try { e.dataTransfer.setData('text/plain', d.name); e.dataTransfer.effectAllowed = 'move'; } catch { /* ignore */ }
    document.body.classList.add('dev-dragging');
  });
  page.addEventListener('dragover', e => {
    if (!drag) return;
    const t = e.target.closest?.('[data-room-drop]');
    if (!t || t.dataset.roomDrop === drag.from) { clear(); return; }
    e.preventDefault();
    if (over !== t) { clear(); over = t; t.classList.add('drop-on'); }
  });
  page.addEventListener('dragleave', e => { if (over && !over.contains(e.relatedTarget)) clear(); });
  page.addEventListener('drop', e => {
    const t = e.target.closest?.('[data-room-drop]'), dd = drag; clear(); drag = null; document.body.classList.remove('dev-dragging');
    if (!dd || !t) return;
    e.preventDefault();
    setRoomFor([dd.id], t.dataset.roomDrop === '__unset' ? null : t.dataset.roomDrop);
  });
  page.addEventListener('dragend', () => { clear(); drag = null; document.body.classList.remove('dev-dragging'); });
}
function addRoom(name, floor) {
  name = String(name || '').trim().slice(0, 40);
  if (!name) return null;
  const ex = doc.rooms.find(r => r.name === name && (r.floor || '') === (floor || ''));
  if (ex) { toast(`「${roomLabel(ex)}」はすでにあります`); return ex.id; }
  const id = uid('r');
  commit(() => { doc.rooms.push({ id, name, floor: floor || '' }); });
  // ほかの部屋には階があるのに、階なしで足したとき：あとから選べるように
  if (!floor && doc.rooms.some(r => r.floor)) toast(`「${name}」を追加しました（階の指定なし）`, { action: '階を選ぶ', onAction: () => openRoomPanel(id), timeout: 5000 });
  else toast(`「${floor ? floor + ' ' : ''}${name}」を追加しました`, { undo: true });
  return id;
}

  if (l.vlans.length > 6) items.push({ t: `+${l.vlans.length - 6}`, c: 'gray' });
  const ws = items.map(x => Math.round(tw(x.t, PORT_FONT) + 9)), total = ws.reduce((a, b) => a + b, 0) + (items.length - 1) * 3;

  });

    const over = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.matches?.('.pp-port'));

    if (roomOf.has(loc.id)) return roomOf.get(loc.id);
    const fl = loc.kind === 'floor' ? loc : climb(loc.parentId, l => l.kind === 'floor');
    const id = `r_${rooms.length + 1}_${Math.random().toString(36).slice(2, 6)}`;

  for (const s of Array.isArray(c.dhcpScopes) ? c.dhcpScopes : []) {
    const p = (Array.isArray(s?.pools) ? s.pools : []).find(x => isIPv4(x?.start) && isIPv4(x?.end) && ipBaseOf(x.start) === ipBaseOf(x.end));

  for (const s of Array.isArray(c.subnets) ? c.subnets : []) { const m = /^((?:\d{1,3}\.){3}\d{1,3})\/(\d{1,2})$/.exec(s?.cidr || ''); if (m && Number(m[2]) >= 24 && s.usage !== 'wan') addNet(canonIP(ipBaseOf(m[1])), null, null); }

}

/* ---------- まとめて追加の読み取り ---------- */
/* 貼り付けた一覧の、名前ではない語（つなぎ方・状態・時間など） */
const BULK_NOISE = /^(有線|無線|有線lan|無線lan|wi-?fi|wireless|wired|ethernet|lan|wlan|接続中|接続済み?|未接続|切断|オンライン|オフライン|online|offline|active|inactive|dhcp|static|固定|自動|リース|残り|期限|有効期限|期限切れ|有効|無効|許可|拒否|ブロック|はい|いいえ|yes|no|ipv4|ipv6|不明|unknown|n\/a|na|none|なし|-+|\*+|\?+|\.+|:+|[・･]+|(2\.4|5|6)\s*g(hz)?|\d+(\.\d+)?\s*(mbps|gbps|kbps|m|g)|-?\d+\s*dbm|\d+\s*(時間|分|秒|日|h|m|s|min|sec|hours?|days?)|\d{1,2}:\d{2}(:\d{2})?|\d{4}[/.-]\d{1,2}[/.-]\d{1,2}|\d{1,2}[/.-]\d{1,2}|ch\s*\d+|\d+\s*ch)$/i;
const isBulkNoise = tok => { const parts = tok.normalize('NFKC').toLowerCase().split(/[()[\]（）【】「」<>〈〉{}]+/).map(x => x.trim()).filter(Boolean); return parts.every(x => x.split(/\s+/).every(y => BULK_NOISE.test(y))); };
const BULK_IP = /(?:^|[^\d.])((?:\d{1,3}\.){3}\d{1,3})(?![\d.])/;
const BULK_MAC = /\b[0-9A-Fa-f]{2}(?:[:-][0-9A-Fa-f]{2}){5}\b|\b[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}\b/;
/** 名前の列から、IP・MAC・つなぎ方などの語を取り除く（名前の文字そのものは変えない） */
function bulkCleanName(col) {
  let c = col;
  const n = c.normalize('NFKC');
  const cut = re => { const m = n.match(re); if (!m) return; const hit = m[1] || m[0]; const i = n.indexOf(hit); if (n.length === c.length && i >= 0) c = c.slice(0, i) + ' ' + c.slice(i + hit.length); else c = c.normalize('NFKC').replace(hit, ' '); };
  cut(BULK_IP); cut(BULK_MAC);
  const toks = c.split(/\s+/).filter(Boolean).filter(t => !isBulkNoise(t));
  return toks.join(' ').replace(/^[\s:：\-–—・,，、|]+|[\s:：\-–—・,，、|]+$/g, '').replace(/[(（[【]\s*[)）\]】]/g, '').trim();
}
function parseBulk(text) {
  const out = [];
  let prev = null;
  for (const raw of String(text || '').split(/\r?\n/)) {
    const orig = raw.trim(); if (!orig) continue;
    const line = orig.normalize('NFKC');
    if (/^(名前|機器名|端末名|ホスト名|デバイス名|hostname|host|name|device)(?=[\s,\t|]|$)/i.test(line) && !/(\d{1,3}\.){3}\d{1,3}/.test(line)) continue;
    if (/(ip\s*アドレス|mac\s*アドレス|ip\s*address|mac\s*address|^no\.?(\s|$))/i.test(line) && !/(\d{1,3}\.){3}\d{1,3}/.test(line) && !BULK_MAC.test(line)) continue;   // 表の見出し
    const ipM = line.match(BULK_IP), macM = line.match(BULK_MAC);
    const ip = ipM && isIPv4(ipM[1]) ? canonIP(ipM[1]) : '';   // 192.168.001.050 → 192.168.1.50
    const mac = macM ? normMac(macM[0]) : '';
    let medium = null;
    if (/無線|wi-?fi|wireless|wlan|(2\.4|5|6)\s*ghz/i.test(line.replace(/wi-?fi\s*(ルーター|ルータ|router|中継器)/gi, ''))) medium = 'wifi';
    else if (/有線|wired|ethernet/i.test(line)) medium = 'lan';
    // 列に分ける（タブ・カンマ・縦線・2つ以上の空白）。行番号だけの最初の列は捨てる
    let body = orig.replace(/^\s*[0-9０-９]{1,3}\s*[.)．）:：](?=\s)\s*/, '');
    // 表計算ソフトの「"居間, スピーカー",192.168.1.60」のような、引用符でくくった項目はカンマで分けない
    let cols = !body.includes('\t') && /(^|,)\s*"/.test(body) ? (parseCSV(body.replace(/,\s+"/g, ',"').replace(/^\s+"/, '"'))[0] || []).map(x => x.trim()).filter(Boolean)
      : body.split(/\t|\s*[,，|｜;；]\s*|\s{2,}|　{1,}/).map(x => x.trim()).filter(Boolean);
    if (cols.length > 1 && /^[0-9０-９]{1,3}$/.test(cols[0])) cols = cols.slice(1);
    const names = cols.map(bulkCleanName).filter(Boolean);
    let name = (cols.length > 1 ? names[0] : names.join(' ')) || '';
    if (/^(不明|unknown|\*+|-+|n\/a|なし|\?+)$/i.test(name)) name = '';
    name = name.slice(0, 80);
    // 1項目ずつ行が分かれた貼り付け（名前／IP／MAC）は、前の行にまとめる
    if (!name && prev && !prev.fromLine && ((ip && !prev.ip && !mac) || (mac && !prev.mac && !ip) || (ip && mac && !prev.ip && !prev.mac))) {
      if (ip) prev.ip = ip; if (mac) prev.mac = mac; if (medium && !prev.medium) prev.medium = medium;
      continue;
    }
    if (!name && !ip && !mac) continue;
    const row = { name: name || (ip ? `機器 .${ip.split('.').pop()}` : `機器 ${mac.slice(-5)}`), ip, mac, type: detectType(name) || 'other', medium };
    if (!name) row.fromLine = true;
    out.push(row); prev = row;
    if (out.length >= 300) break;
  }
  for (const r of out) delete r.fromLine;
  return out;
}

/* ---------- CSV ---------- */
function exportCSV() {

        m === 'router' ? 'ルーター' : m === 'bridge' ? 'ブリッジ' : (AP_LABEL[a.apMode] || ''), a.wan ? WAN_LABEL[a.wan] + (a.ipoeSvc ? `（${a.ipoeSvc}）` : '') : '',
        (a.routes || []).map(x => `${x.dest} → ${x.gw}${x.note ? `（${x.note}）` : ''}`).join(' / '), a.lag ? (a.lag === 'lacp' ? 'LACP' : '静的') + (a.lagPorts ? ` ${a.lagPorts}` : '') : '', d.url, d.ssid, a.fw || '', d.notes];

  const cell = v => { let s = String(v ?? ''); if (/^[=+@\-\t\r]/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');

/* ---------- 画像 ---------- */
async function svgToPng({ svg, W, H }) {
  const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('描画に失敗しました')); img.src = url; });
    const want = Number(prefs.exp?.scale) || 2;
    const scale = Math.max(0.5, Math.min(want, 12000 / Math.max(W, H)));
    const c = document.createElement('canvas');
    c.width = Math.round(W * scale); c.height = Math.round(H * scale);
    const ctx = c.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.drawImage(img, 0, 0, W, H);
    return await new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error('PNGにできませんでした'))), 'image/png'));
  } finally { URL.revokeObjectURL(url); }
}
const imageName = ext => `homenet-${prefs.mode === 'rooms' ? 'rooms' : 'map'}-${stamp()}.${ext}`;
async function makePng() {
  const out = buildExportSVG(); if (!out) throw new Error('構成図に機器がありません');
  const blob = await svgToPng(out);
  return { blob, name: imageName('png') };
}
async function exportImage(kind = 'png') {
  if (!doc.devices.length) { toast('構成図に機器がありません'); return; }
  try {
    if (kind === 'svg') {
      const out = buildExportSVG();
      download(new Blob([out.svg], { type: 'image/svg+xml' }), imageName('svg'));
      toast('SVGで保存しました');
      return;
    }
    const { blob, name } = await makePng();
    download(blob, name);
    toast('画像（PNG）で保存しました');
  } catch (e) { toast('画像にできませんでした：' + (e.message || e)); }
}
async function sharePrepared() {
  if (!preparedPng) { toast('画像を準備しています。もう一度押してください'); return; }
  const file = new File([preparedPng.blob], preparedPng.name, { type: 'image/png' });
  try { await navigator.share({ files: [file], title: doc.name }); closePanel(); }
  catch (e) { if (e?.name !== 'AbortError') toast('共有できませんでした'); }
}

/* =====================================================================
   05m menu — 右クリック（PC）／長押し（スマホ）メニュー、その場で名前変更、まとめて変更
   ===================================================================== */
const menu = { root: null, items: null, touch: false, pushed: false, armed: false, stack: [], title: '', returnFocus: null, subTimer: 0 };
let historyCarry = false;
const menuOpen = () => !!menu.items;

/* items: { label, icon, kbd, danger, disabled, checked, hint, run, sub, sep, head } */
function openMenu(items, { x = 0, y = 0, touch = false, title = '' } = {}) {
  closeMenu({ keepHistory: true });
  items = items.filter(Boolean);
  if (!items.length) return;
  hideToast();
  menu.items = items; menu.touch = touch; menu.title = title; menu.stack = []; menu.armed = false;
  menu.returnFocus = document.activeElement;
  if (!menu.root) { menu.root = document.createElement('div'); menu.root.id = 'menuRoot'; document.body.appendChild(menu.root); bindMenuRoot(); }
  if (touch) {
    if (!panel.pushed && !menu.pushed) { try { history.pushState({ hnaMenu: 1 }, ''); menu.pushed = !!history.state?.hnaMenu; } catch { menu.pushed = false; } }
    renderTouchMenu();
  } else {
    menu.root.innerHTML = `<div class="ctx-menu" role="menu" data-level="0" tabindex="-1">${menuListHTML(items, 0)}</div>`;
    const el = $('.ctx-menu', menu.root);
    placeMenu(el, x, y);
    el.focus({ preventScroll: true });
  }
}
function menuListHTML(items, level) {
  return items.map((it, i) => {
    if (it.sep) return '<div class="ctx-sep" role="separator"></div>';
    if (it.head) return `<div class="ctx-head">${esc(it.head)}</div>`;
    const cls = ['ctx-item'];
    if (it.danger) cls.push('danger');
    if (it.checked) cls.push('checked');
    const lead = it.checked ? ic('check', 's16') : (it.icon ? ic(it.icon, 's16') : '<span class="ic s16"></span>');
    const trail = it.sub ? ic('chev-r', 's16 trail') : (it.kbd ? `<kbd>${esc(it.kbd)}</kbd>` : '');
    return `<button type="button" class="${cls.join(' ')}" role="menuitem" data-i="${i}" data-level="${level}"${it.sub ? ' aria-haspopup="menu"' : ''}${it.disabled ? ' disabled' : ''}>${lead}<span class="ctx-label">${esc(it.label)}${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</span>${trail}</button>`;
  }).join('');
}
function placeMenu(el, x, y, anchor = null) {

  const vw = innerWidth, vh = innerHeight, r = { width: el.offsetWidth, height: el.offsetHeight };
  let left = x, top = y;
  if (anchor) {
    left = anchor.right - 4; top = anchor.top - 6;
    if (left + r.width > vw - 8) left = anchor.left - r.width + 4;
  } else if (left + r.width > vw - 8) left = Math.max(8, x - r.width);
  if (top + r.height > vh - 8) top = Math.max(8, vh - r.height - 8);

}
function renderTouchMenu() {

  menu.root.innerHTML = `<div class="ctx-scrim" data-ctx-close></div><div class="ctx-sheet" role="menu">
    <div class="ctx-sheet-head">${level ? `<button type="button" class="icon-btn" data-ctx-back aria-label="戻る">${ic('chev-r', 'flip')}</button>` : '<span></span>'}<b>${esc(cur.title || '')}</b><button type="button" class="icon-btn" data-ctx-close aria-label="閉じる">${ic('x')}</button></div>

function itemAt(btn) {

  $$('.ctx-menu', menu.root).forEach(m => { if (Number(m.dataset.level) >= level) m.remove(); });
  $$(`.ctx-menu[data-level="${level - 1}"] .ctx-item.open`, menu.root).forEach(b => b.classList.remove('open'));
  btn.classList.add('open');
  menu.stack.length = level - 1;

}
function runMenuItem(it) {
  const carry = menu.pushed;
  menu.pushed = false;
  closeMenu({ keepHistory: true, restore: false });
  historyCarry = carry;
  try { it.run?.(); }
  finally {
    if (historyCarry) {
      historyCarry = false;
      if (history.state?.hnaMenu) { ignorePop = true; setTimeout(() => { ignorePop = false; }, 700); history.back(); }
    }

}
function closeMenu({ fromPop = false, keepHistory = false, restore = true } = {}) {

  menu.items = null; menu.stack = [];
  clearTimeout(menu.subTimer);
  if (menu.root) menu.root.innerHTML = '';
  if (menu.pushed && !keepHistory) {
    menu.pushed = false;
    if (!fromPop && history.state?.hnaMenu) { ignorePop = true; setTimeout(() => { ignorePop = false; }, 700); history.back(); }
  }

    if (e.target.closest('[data-ctx-close]')) { closeMenu(); return; }
    if (e.target.closest('[data-ctx-back]')) { menu.stack.pop(); renderTouchMenu(); return; }
    const btn = e.target.closest('.ctx-item'); if (!btn || btn.disabled) return;
    const it = itemAt(btn); if (!it) return;
    if (it.sub) {
      if (menu.touch) { menu.stack.push({ items: subItems(it), title: it.label }); renderTouchMenu(); }

    }

  });
  R.addEventListener('mouseover', e => {
    if (menu.touch) return;
    const btn = e.target.closest('.ctx-item'); if (!btn) return;
    btn.focus({ preventScroll: true });
    clearTimeout(menu.subTimer);
    const level = Number(btn.dataset.level);
    menu.subTimer = setTimeout(() => {
      if (!menu.items) return;
      if (itemAt(btn)?.sub) { if (!btn.classList.contains('open')) openSubFlyout(btn); }
      else { $$('.ctx-menu', menu.root).forEach(m => { if (Number(m.dataset.level) > level) m.remove(); }); $$(`.ctx-menu[data-level="${level}"] .ctx-item.open`, menu.root).forEach(b => b.classList.remove('open')); menu.stack.length = level; }
    }, 140);
  });
  R.addEventListener('keydown', e => {
    const btn = e.target.closest('.ctx-item');

    const i = items.indexOf(btn);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

      const n = items.length; if (!n) return;

}
let lastTouchAt = 0;

function alignSel(dir) {
  // 配線の画面では、配線の図の位置（wx・wy）と、前面パネルの大きさで並べる
  const wire = prefs.mode === 'wire', X = wire ? 'wx' : 'x', Y = wire ? 'wy' : 'y';
  const ds = [...ui.sel].map(devById).filter(d => d && d[X] != null && !d.locked);
  if (ds.length < 2) return;
  const size = d => (wire ? wireLayout(d) : { w: nodeBox(d).w, h: NODE_H });
  commit(() => {
    if (dir === 'row') {
      ds.sort((a, b) => a[X] - b[X]);
      const y = Math.round(ds.reduce((s, d) => s + d[Y], 0) / ds.length / 8) * 8;
      let x = ds[0][X];
      for (const d of ds) { d[Y] = y; d[X] = x; x += size(d).w + (wire ? 30 : 22); }
    } else {
      ds.sort((a, b) => a[Y] - b[Y]);
      const x = Math.min(...ds.map(d => d[X]));
      let y = ds[0][Y];
      for (const d of ds) { d[X] = x; d[Y] = y; y += size(d).h + (wire ? 40 : 14); }
    }
  });
}

}

function mapMenuAt(target, clientX, clientY, touch) {
  endConnectMode();
  const node = target.closest?.('[data-node]'), edge = target.closest?.('[data-link]');
  const room = target.closest?.('[data-room-tag], [data-room-box]');
  const ann = target.closest?.('[data-annot]');
  const multiTitle = () => `${ui.sel.size + ui.selA.size}個を選択中`;
  // 配線：口やプラグの上では、その口のメニュー
  const port = prefs.mode === 'wire' && target.closest?.('[data-wport], [data-wplug]');
  if (port) {
    const [dev, key] = (port.dataset.wport || port.dataset.wplug).split('|');
    const d = devById(dev);
    if (d) {
      const l = linkAtPort(dev, key);
      ui.wport = { dev, key }; ui.sel = new Set([dev]); ui.selLink = l?.id || null; ui.selA.clear(); renderMap();
      openMenu(wirePortMenuItems(dev, key), { x: clientX, y: clientY, touch, title: `${d.name} ${slotLabel(d, key)}` });
      return;
    }
  }
  if (node && node.dataset.bundle) {
    const b = geo.F?.get(node.dataset.node);
    if (b) { ui.sel = new Set(b.members); ui.selA.clear(); ui.selLink = null; renderMap(); openMenu(bundleMenuItems(b.gid), { x: clientX, y: clientY, touch, title: `${b.g.name}（${b.members.length}台）` }); return; }
  }
  if (node) {
    const id = node.dataset.node;
    if (!ui.sel.has(id)) { ui.sel.clear(); ui.selA.clear(); ui.sel.add(id); }
    ui.selLink = null; renderMap();
    if (ui.sel.size + ui.selA.size > 1) openMenu(multiMenuItems([...ui.sel]), { x: clientX, y: clientY, touch, title: multiTitle() });
    else openMenu(deviceMenuItems(id), { x: clientX, y: clientY, touch, title: devById(id)?.name });
    return;
  }
  if (ann) {
    const id = ann.dataset.annot;
    if (!ui.selA.has(id)) { ui.sel.clear(); ui.selA = new Set([id]); }
    ui.selLink = null; renderMap();
    if (ui.sel.size + ui.selA.size > 1) openMenu(multiMenuItems([...ui.sel]), { x: clientX, y: clientY, touch, title: multiTitle() });
    else { const a = annotById(id); openMenu(annotMenuItems(id), { x: clientX, y: clientY, touch, title: a?.kind === 'frame' ? (a.title || '枠') : 'メモ' }); }
    return;
  }
  if (edge) {
    ui.sel.clear(); ui.selLink = edge.dataset.link; renderMap();
    const l = linkById(ui.selLink);
    openMenu(linkMenuItems(ui.selLink), { x: clientX, y: clientY, touch, title: l ? `${devById(l.a)?.name} — ${devById(l.b)?.name}` : '' });
    return;
  }

let renameState = null;
function startRename(id) {

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
